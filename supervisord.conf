[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisor:messages]
command=node server/index.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/schoology.err.log
stdout_logfile=/var/log/schoology.out.log

[supervisor:schoology]
command=/app/.schoology-venv/bin/gunicorn -b 0.0.0.0:8081 --workers 1 --chdir /app/schoology server:app
directory=/app/schoology
autostart=true
autorestart=true
stderr_logfile=/var/log/schoology.err.log
stdout_logfile=/var/log/schoology.out.log