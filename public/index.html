<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function(){var t=typeof localStorage!=='undefined'&&localStorage.getItem('theme');if(t==='simple'||t==='comic'||t==='jimmyqrg')document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>JimmyQrg Chat</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon-128.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/assets/icons/favicon-128.png" id="favicon-128" />
  <link rel="apple-touch-icon" sizes="128x128" href="/assets/icons/favicon-128.png" id="apple-touch-128" />
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/icons/favicon-256.png" />
  <link rel="apple-touch-icon" sizes="256x256" href="/assets/icons/favicon-256.png" />
  <script>
    (function(){
      var loaded = false;
      function load512() {
        if (loaded) return;
        var img = new Image();
        img.onload = function() {
          loaded = true;
          var a = document.getElementById('favicon-128');
          var b = document.getElementById('apple-touch-128');
          if (a) { a.href = '/assets/icons/favicon-512.png'; a.sizes = '512x512'; }
          if (b) { b.href = '/assets/icons/favicon-512.png'; b.sizes = '512x512'; }
        };
        img.onerror = function() {
          var fallback = new Image();
          fallback.onload = function() {
            loaded = true;
            var a = document.getElementById('favicon-128');
            var b = document.getElementById('apple-touch-128');
            if (a) { a.href = '/assets/icons/favicon-256.png'; a.sizes = '256x256'; }
            if (b) { b.href = '/assets/icons/favicon-256.png'; b.sizes = '256x256'; }
          };
          fallback.src = '/assets/icons/favicon-256.png';
        };
        img.src = '/assets/icons/favicon-512.png';
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(load512, { timeout: 3000 });
      } else {
        setTimeout(load512, 2000);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/css/style.css?v=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin />
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin></script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading…</p>
    </div>
  </div>
  <script type="module" src="/assets/js/main.js?v=1"></script>
</body>
</html>
