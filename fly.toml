# fly.toml app configuration file generated for jchat on 2026-02-28T21:01:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jchat'
primary_region = 'iad'

[build]

# Persistent storage: REQUIRED to keep login and data across restarts. Create volume once before first deploy:
#   fly volumes create chat_data --region iad --size 1
[mounts]
  source = "chat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
