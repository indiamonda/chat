# fly.toml for JimmyQrg Chat
# Deploy: fly launch (first time), then fly deploy

app = "jimmyqrg-chat"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "chat_data"
  destination = "/data"
